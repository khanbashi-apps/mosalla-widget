name: inspect-glassify
# يحمّل Glassify بحساب Apple الخاص بالمستخدم (من Secrets) ويطبع فقط
# معلومات ملف الويدجت (Info.plist والأوامر المستوردة). لا يرفع ملف IPA ولا ينشره.
on:
  workflow_dispatch:
    inputs:
      code:
        description: "رمز التحقق من Apple (6 أرقام)، اتركه فارغاً في المرة الأولى"
        required: false
        default: ""
      appid:
        description: "App Store ID"
        required: false
        default: "6741079325"
jobs:
  inspect:
    runs-on: macos-26
    steps:
      - name: Install ipatool
        run: brew install ipatool
      - name: Login
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          CODE: ${{ github.event.inputs.code }}
        run: |
          if [ -n "$CODE" ]; then
            ipatool auth login -e "$APPLE_ID" -p "$APPLE_PASSWORD" --auth-code "$CODE" --keychain-passphrase ci --non-interactive
          else
            ipatool auth login -e "$APPLE_ID" -p "$APPLE_PASSWORD" --keychain-passphrase ci --non-interactive || { echo "::warning::أرسل الرمز اللي وصلك وشغّل من جديد"; exit 1; }
          fi
      - name: Download
        run: |
          mkdir -p dl
          ipatool purchase -i "${{ github.event.inputs.appid }}" --keychain-passphrase ci --non-interactive || true
          ipatool download -i "${{ github.event.inputs.appid }}" -o dl/app.ipa --keychain-passphrase ci --non-interactive
          ls -la dl
      - name: Inspect widget
        run: |
          cd dl && unzip -q app.ipa
          APP=$(ls -d Payload/*.app)
          echo "===== APP Info.plist"; plutil -p "$APP/Info.plist" | head -60
          for X in "$APP"/PlugIns/*.appex "$APP"/Extensions/*.appex; do
            [ -d "$X" ] || continue
            echo "=================== $X"
            plutil -p "$X/Info.plist"
            B="$X/$(plutil -extract CFBundleExecutable raw "$X/Info.plist")"
            echo "----- entitlements"; codesign -d --entitlements :- "$B" 2>/dev/null | plutil -p - 2>/dev/null || true
            echo "----- load commands"; otool -l "$B" | grep -E -A4 "LC_BUILD_VERSION|LC_ENCRYPTION_INFO"
            echo "----- linked libraries"; otool -L "$B"
            echo "----- imported symbols (demangled)"; nm -u "$B" | xcrun swift-demangle | sort -u
            echo "----- files"; ls -la "$X"
          done
